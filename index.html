<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="A small, slightly chaotic shelf of games made by friends.">
  <title>Runoki — Games, probably</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">Runoki</a>
    <a class="header-link" href="#games">Go play something <span aria-hidden="true">↓</span></a>
  </header>
  <main>
    <section class="intro">
      <div class="intro-copy">
        <p class="hand-note">A little game shelf on the internet</p>
        <h1>Runoki<span class="title-period">.</span></h1>
        <p class="intro-line">Games made by friends.<br>Some are good. All are playable.</p>
      </div>
      <div class="scribble" aria-hidden="true"><span>probably<br>just one more</span><i></i></div>
    </section>
    <section class="games-section" id="games">
      <div class="list-heading"><h2>Pick a game</h2><label class="search"><span class="visually-hidden">Search games</span><input id="game-search" type="search" placeholder="Search…" autocomplete="off"></label></div>
      <nav class="category-list" id="category-list" aria-label="Filter games by category"></nav>
      <div class="game-grid" id="game-grid" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer"><a class="wordmark" href="index.html">Runoki</a><p>Close the tab when your mum says so.</p></footer>
</body>
</html>
