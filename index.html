<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="A friendly collection of small games from Runoki and friends.">
  <title>Runoki — Games to play</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html"><img src="assets/runoki-face.svg" alt="" width="38" height="38"><span>Runoki</span></a>
    <a class="header-link" href="#games">Games</a>
  </header>
  <main>
    <section class="intro">
      <h1>Games to play.<br><span>Made by our friends.</span></h1>
      <p>Pick a game, get comfy, and have a go.</p>
    </section>
    <section class="games-section" id="games">
      <div class="list-heading"><h2>All games</h2><label class="search"><span class="visually-hidden">Search games</span><input id="game-search" type="search" placeholder="Find a game…" autocomplete="off"></label></div>
      <nav class="category-list" id="category-list" aria-label="Filter by category"></nav>
      <div class="game-grid" id="game-grid" aria-live="polite"></div>
      <p class="game-count"><span id="game-count">0</span> games</p>
    </section>
  </main>
  <footer class="site-footer"><a class="wordmark" href="index.html"><img src="assets/runoki-face.svg" alt="" width="32" height="32"><span>Runoki</span></a><p>Made by friends. Play with friends.</p></footer>
</body>
</html>
