<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>Play — Runoki</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body class="game-page">
  <header class="site-header game-header">
    <a class="wordmark" href="index.html"><img src="assets/runoki-face.svg" alt="" width="38" height="38"><span>Runoki</span></a>
    <a class="back-link" href="index.html#games">← All games</a>
  </header>
  <main class="detail-main">
    <div class="detail-top">
      <div><p class="eyebrow">NOW PLAYING</p><h1 id="detail-title">Loading game…</h1></div>
      <button class="button play-button" id="play-button" type="button">Play game</button>
    </div>
    <div class="game-stage" id="game-stage">
      <div class="stage-placeholder" id="stage-placeholder"><p>Ready when you are.</p><button class="button button-light" id="stage-play" type="button">Start playing</button></div>
      <iframe id="game-frame" title="Game" allow="fullscreen; gamepad" loading="lazy"></iframe>
      <div class="fullscreen-bar"><a href="index.html" class="bar-brand"><img src="assets/runoki-face.svg" alt="" width="24" height="24"><span>Runoki</span></a><span id="bar-title">Runoki</span><button id="fullscreen-button" type="button" aria-label="Enter fullscreen">Fullscreen</button></div>
    </div>
    <div class="detail-bottom"><p id="detail-description"></p><span class="game-tag" id="detail-tag"></span></div>
  </main>
  <footer class="site-footer"><a class="wordmark" href="index.html"><img src="assets/runoki-face.svg" alt="" width="32" height="32"><span>Runoki</span></a><p>Made by friends. Play with friends.</p></footer>
</body>
</html>
