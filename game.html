<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Play — Runoki</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body class="game-page">
  <header class="site-header game-header">
    <a class="wordmark" href="index.html"><span class="brand-mark">r</span> runoki</a>
    <a class="back-link" href="index.html#games"><span aria-hidden="true">←</span> All games</a>
  </header>
  <main class="detail-main">
    <div class="detail-top">
      <div><p class="eyebrow"><span class="live-dot"></span> NOW PLAYING</p><h1 id="detail-title">Loading game…</h1></div>
      <button class="button button-dark play-button" id="play-button" type="button">Play game <span aria-hidden="true">↗</span></button>

    <div class="game-stage" id="game-stage">
      <div class="stage-placeholder" id="stage-placeholder"><span class="placeholder-icon">↗</span><p>Your next little obsession is one click away.</p><button class="button button-light" id="stage-play" type="button">Start playing</button></div>

      <div class="fullscreen-bar"><a href="index.html" class="bar-brand"><span class="brand-mark">r</span> runoki</a><span id="bar-title">Runoki</span><button id="fullscreen-button" type="button" aria-label="Enter fullscreen">⛶ <span>Fullscreen</span></button></div>
    </div>
    <div class="detail-bottom"><p id="detail-description"></p><span class="game-tag" id="detail-tag"></span></div>
  </main>
  <footer class="site-footer"><a class="wordmark" href="index.html"><span class="brand-mark">r</span> runoki</a><p>Made for playing. Made together.</p><span>© RUNOKI</span></footer>
